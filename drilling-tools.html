<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robur Drilling Tools - Advanced Mining Equipment</title>
    <link rel="preload" as="image" href="images/drilling-theme-hero.jpeg?v=8" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="Bagerich/Bagerich-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="web-styles.css">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>

    <style>
        :root {
            --drill-orange: #ff6b35;
            --drill-rock: #1a1614;
            --drill-text: #f4f0ea;
            --drill-muted: rgba(244, 240, 234, 0.78);
        }

        html,
        body.drill-page {
            margin: 0;
            min-height: 100%;
        }

        body.drill-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            font-family: var(--font-default);
            color: var(--drill-text);
            background: var(--drill-rock);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .drill-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: var(--drill-rock);
        }

        /* contain = full photo visible (letterboxing); bottom bias keeps subject lower in frame */
        .drill-bg img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            display: block;
        }

        .division-back {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 2;
            width: fit-content;
            max-width: calc(100vw - 2rem);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.48rem 0.9rem;
            border-radius: 999px;
            background: rgba(12, 10, 9, 0.45);
            color: var(--drill-text);
            text-decoration: none !important;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255, 107, 53, 0.45);
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .division-back:hover,
        .division-back:focus-visible {
            background: rgba(255, 107, 53, 0.18);
            border-color: var(--drill-orange);
            outline: none;
        }

        .division-back:focus-visible {
            box-shadow: 0 0 0 2px rgba(244, 240, 234, 0.35);
        }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            padding: 5rem 1rem 1.25rem;
            background: transparent;
        }

        .page-footer {
            margin: 0;
            display: inline-block;
            text-align: center;
            font-size: clamp(0.8rem, 1.8vw, 0.95rem);
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--drill-muted);
            padding: 0.5rem 1.15rem 0.55rem;
            border-radius: 999px;
            box-sizing: border-box;
            background: rgba(8, 7, 6, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.85),
                0 0 10px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body class="drill-page">
    <div class="drill-bg" aria-hidden="true">
        <img
            src="images/drilling-theme-hero.jpeg?v=8"
            alt=""
            width="1920"
            height="1080"
            decoding="async"
            fetchpriority="high"
        >
    </div>
    <a href="index.html" class="division-back" aria-label="Back to home">← Back</a>
    <main aria-label="Drilling Tools">
        <p class="page-footer">Developed by Fidinsky</p>
    </main>
</body>
</html>

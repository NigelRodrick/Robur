<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robur Drilling Tools</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            height: 100%;
        }
        body {
            min-height: 100dvh;
            background-color: #f4f0ec;
            background-image:
                radial-gradient(ellipse 90% 70% at 88% -8%, rgba(255, 138, 84, 0.55), transparent 52%),
                radial-gradient(ellipse 65% 50% at 4% 102%, rgba(255, 154, 98, 0.28), transparent 50%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255, 200, 170, 0.12), transparent 60%);
            background-attachment: fixed;
        }
    </style>
</head>

</html>

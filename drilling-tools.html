<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Robur Drilling Tools">
    <title>Robur Drilling Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="images/drilling-page-logo.jpeg" as="image">
    <link rel="preload" href="images/drilling-hero-full.jpeg" as="image">
    <link rel="preload" href="Bagerich/Bagerich-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="web-styles.css">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
    <style>
        :root {
            /* Page surround — pastel tint (near RAL 2003 / hero solid) */
            --drill-outer: #fff3eb;
            /*
             * Solid orange from hero artwork (brand match):
             * Hex #E6812E · rgb(230, 129, 46) · HSL 27° 78% 54% · CMYK 0,44,80,10
             * Close to RAL 2003 Pastel Orange / safety orange family.
             */
            --drill-orange-solid: #e6812e;
            --drill-orange-mid: var(--drill-orange-solid);
            --drill-orange-deep: #9d5c1f;
            /* Sampled from drilling-page-logo.jpeg border (~#d25711) — header matches logo plate */
            --drill-logo-plate: rgb(210, 87, 17);
            /* Footer bar */
            --drill-header-footer: #8b2500;
            /* Average of hero JPEG corners — matches flat orange in file (vs pure #e6812e) */
            --drill-hero-letterbox: rgb(228, 123, 45);
            --drill-stretch-gap: clamp(0.65rem, 2.2vw, 1.05rem);
            /* Measured at runtime (see script); fallback until then */
            --drill-header-measured-px: 5.75rem;
            --drill-bar-pad-bottom: 0.35rem;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            margin: 0;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        html, body {
            margin: 0;
            width: 100%;
            max-width: 100%;
        }

        body.drill-radial-theme {
            --bg: var(--drill-outer);
            --text-main: rgba(72, 38, 18, 0.95);
            --text-muted: rgba(110, 58, 32, 0.78);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            background:
                linear-gradient(
                    180deg,
                    #fff8f2 0%,
                    var(--drill-outer) 28%,
                    var(--drill-outer) 100%
                );
            color: var(--text-main);
            font-family: var(--font-default);
            -webkit-font-smoothing: antialiased;
        }

        .drill-theme-shell {
            flex: 1 0 auto;
            width: 100%;
            min-height: min(100dvh, 100vh);
            position: relative;
            isolation: isolate;
            overflow: visible;
            background-color: #ce7228;
        }

        .drill-theme-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.98;
            background-image:
                linear-gradient(
                    180deg,
                    rgba(255, 248, 240, 0.4) 0%,
                    transparent 24%
                ),
                linear-gradient(
                    180deg,
                    transparent 0%,
                    transparent 52%,
                    rgba(60, 32, 12, 0.12) 78%,
                    rgba(90, 49, 18, 0.45) 92%,
                    rgba(90, 49, 18, 0.65) 100%
                ),
                radial-gradient(
                    ellipse 92% 80% at 50% 42%,
                    #fff4ea 0%,
                    #ffe9d6 7%,
                    #ffd4b0 14%,
                    #f4b078 22%,
                    #eca666 30%,
                    var(--drill-orange-mid) 40%,
                    #e07825 48%,
                    #c8641e 56%,
                    var(--drill-orange-deep) 68%,
                    #7a4518 80%,
                    #543210 90%,
                    #3f260c 100%
                );
        }

        /* Single primary column: hero + category stack share one rail width */
        .drill-page-main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: min(72rem, 100%);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            row-gap: clamp(1.5rem, 4vw, 2.75rem);
            box-sizing: border-box;
        }

        /*
         * Hero band: 16:9 tile (contain). JS sets padding-top for fixed bar.
         * Page title is visually hidden (see .drill-sr-only) so the hero is image-only.
         */
        body.drill-radial-theme .drill-theme-shell .drill-hero-center {
            position: relative;
            z-index: 2;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            background: var(--drill-hero-letterbox);
            padding: var(--drill-header-measured-px, 5.75rem) 0 clamp(2rem, 6vw, 3.25rem);
            pointer-events: none;
            overflow-x: hidden;
            overflow-y: visible;
            border-bottom: 1px solid rgba(45, 24, 10, 0.18);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .drill-sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        .drill-hero-gallery,
        .drill-cat-gallery {
            --drill-hero-gallery-gap: clamp(0.65rem, 1.75vw, 1.15rem);
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--drill-hero-gallery-gap);
            width: 100%;
            margin: 0;
            padding: 0 clamp(0.75rem, 3vw, 1.5rem);
            padding-left: max(clamp(0.75rem, 3vw, 1.5rem), env(safe-area-inset-left, 0px));
            padding-right: max(clamp(0.75rem, 3vw, 1.5rem), calc(env(safe-area-inset-right, 0px) + 3.5rem));
            box-sizing: border-box;
        }

        /* Sit hero tile higher — into space where the visible intro used to sit */
        .drill-hero-gallery {
            margin-top: clamp(-2.75rem, -7vw, -0.85rem);
        }

        .drill-cat-gallery {
            margin-top: clamp(0.75rem, 2vw, 1.25rem);
        }

        .drill-hero-figure,
        .drill-cat-figure {
            margin: 0;
            overflow: hidden;
            line-height: 0;
            min-width: 0;
            min-height: 0;
            grid-column: 1 / -1;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--drill-hero-letterbox);
            border-radius: clamp(4px, 1vw, 10px);
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.35),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .drill-hero-figure {
            transform: translateZ(0);
            animation: drill-hero-float 5.5s ease-in-out infinite;
        }

        @keyframes drill-hero-float {
            0%, 100% {
                transform: translate3d(0, 0, 0);
                box-shadow:
                    0 12px 28px rgba(0, 0, 0, 0.32),
                    0 4px 12px rgba(35, 18, 8, 0.18),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
            50% {
                transform: translate3d(0, -10px, 0);
                box-shadow:
                    0 22px 48px rgba(35, 18, 8, 0.38),
                    0 8px 20px rgba(0, 0, 0, 0.28),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .drill-hero-figure {
                animation: none;
                transform: none;
                box-shadow:
                    0 12px 32px rgba(0, 0, 0, 0.35),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
        }

        body.drill-radial-theme .drill-hero-figure .drill-tile-img,
        body.drill-radial-theme .drill-cat-figure .drill-tile-img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            object-fit: contain;
            object-position: center;
            margin: 0;
            border: none;
            outline: none;
            box-shadow: none;
            border-radius: 0 !important;
            transform: none;
            transform-origin: center center;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* Category stack: rhythm + panels aligned to page rail */
        .drill-cat-page {
            position: relative;
            z-index: 1;
            width: 100%;
            margin: 0;
            padding: clamp(0.35rem, 1.5vw, 0.85rem) 0 clamp(2.25rem, 5vw, 3.25rem);
            box-sizing: border-box;
        }

        .drill-cat-stack {
            display: flex;
            flex-direction: column;
            gap: clamp(1.35rem, 3.5vw, 2.25rem);
            width: 100%;
        }

        .drill-cat-section {
            scroll-margin-top: clamp(5.5rem, 14vw, 8.75rem);
            margin: 0;
            padding: clamp(1.25rem, 3.2vw, 1.85rem) max(clamp(0.75rem, 3vw, 1.5rem), env(safe-area-inset-left, 0px))
                clamp(1.25rem, 3.2vw, 1.85rem)
                max(clamp(0.75rem, 3vw, 1.5rem), calc(env(safe-area-inset-right, 0px) + 3.5rem));
            border-radius: clamp(10px, 1.5vw, 16px);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 4px 24px rgba(35, 18, 8, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .drill-cat-section h2 {
            position: relative;
            margin: 0 0 0.15rem;
            padding: 0 0 0.85rem;
            font-size: clamp(1.45rem, 4.1vw, 2.1rem);
            font-weight: 700;
            line-height: 1.15;
            text-align: center;
            color: rgba(255, 252, 248, 0.98);
            letter-spacing: -0.02em;
            text-shadow:
                0 2px 6px rgba(0, 0, 0, 0.72),
                0 0 26px rgba(0, 0, 0, 0.32);
        }

        .drill-cat-section h2::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0.2rem;
            transform: translateX(-50%);
            width: min(5rem, 40vw);
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 220, 190, 0.65),
                rgba(255, 255, 255, 0.45),
                rgba(255, 220, 190, 0.65),
                transparent
            );
        }

        .drill-cat-section .drill-cat-gallery {
            margin-top: clamp(0.35rem, 1.2vw, 0.65rem);
            padding-left: 0;
            padding-right: 0;
        }

        /* Tapered image deferred until scroll / in-page nav (see inline script) */
        #drill-section-tapered.drill-tapered-pending .drill-cat-gallery {
            display: none;
        }

        /* Fixed header: logo + Home + category menu */
        .drill-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding:
                max(1rem, env(safe-area-inset-top, 0px))
                max(1rem, env(safe-area-inset-right, 0px))
                var(--drill-bar-pad-bottom)
                max(1rem, env(safe-area-inset-left, 0px));
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr);
            align-items: center;
            column-gap: 1rem;
            row-gap: 0.75rem;
            background: var(--drill-logo-plate);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.14),
                0 20px 40px -14px rgba(35, 18, 8, 0.28);
            pointer-events: none;
        }

        .drill-top-bar > * {
            pointer-events: auto;
        }

        .drill-top-bar-lead {
            grid-column: 1;
            justify-self: start;
            display: flex;
            flex-direction: row;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.65rem;
            min-width: 0;
        }

        .drill-nav {
            grid-column: 2;
            justify-self: stretch;
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-evenly;
            column-gap: 0;
            row-gap: var(--drill-stretch-gap);
        }

        .drill-top-bar-end {
            grid-column: 3;
            min-width: 0;
            pointer-events: none;
        }

        @media (max-width: 54rem) {
            .drill-top-bar {
                grid-template-columns: 1fr;
            }

            .drill-top-bar-lead {
                grid-column: 1;
            }

            .drill-nav {
                grid-column: 1;
            }

            .drill-top-bar-end {
                display: none;
            }
        }

        @media (max-width: 36rem) {
            .drill-nav {
                flex-wrap: wrap;
                justify-content: center;
                row-gap: var(--drill-stretch-gap);
                column-gap: var(--drill-stretch-gap);
            }

            .drill-nav-link {
                flex-shrink: 0;
                white-space: normal;
                text-align: center;
                max-width: 100%;
            }
        }

        .drill-nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.42rem 0.72rem;
            border-radius: 999px;
            font-size: clamp(0.7rem, 1.9vw, 0.8125rem);
            font-weight: 600;
            letter-spacing: 0.03em;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.95) !important;
            text-shadow: 0 1px 2px rgba(90, 32, 12, 0.4);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(90, 42, 16, 0.22);
            transition: background 0.2s ease, border-color 0.2s ease;
            white-space: nowrap;
        }

        .drill-nav-link:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.42);
        }

        .drill-nav-link:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.9);
            outline-offset: 2px;
        }

        .drill-floating-home {
            position: static;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.96) !important;
            text-decoration: none;
            text-shadow: 0 1px 2px rgba(90, 32, 12, 0.4);
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.38);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(90, 42, 16, 0.22);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .drill-floating-home:hover {
            background: rgba(255, 255, 255, 0.26);
            border-color: rgba(255, 255, 255, 0.52);
        }

        .drill-logo-link {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            line-height: 0;
            text-decoration: none;
            padding: 0;
            border: none;
            background: transparent;
            box-shadow: none;
        }

        .drill-logo-link:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.9);
            outline-offset: 4px;
            border-radius: 6px;
        }

        .drill-logo-img {
            height: clamp(2.45rem, 8.5vw, 3.35rem);
            width: auto;
            max-width: min(280px, 62vw);
            object-fit: contain;
            display: block;
        }

        .drill-social-rail {
            position: fixed;
            top: 50%;
            bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
            right: max(0.65rem, env(safe-area-inset-right, 0px));
            z-index: 95;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: stretch;
            min-height: 0;
            pointer-events: none;
        }

        .drill-social-rail .drill-social-link {
            pointer-events: auto;
        }

        .drill-social-list {
            list-style: none;
            margin: 0;
            padding: 0;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            gap: 0;
        }

        .drill-social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(3.25rem, 5.5vw, 3.65rem);
            height: clamp(3.35rem, 5.75vw, 3.85rem);
            min-height: 3.35rem;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.96) !important;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 14px rgba(90, 42, 16, 0.22);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .drill-social-link:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.42);
            transform: scale(1.06);
        }

        .drill-social-link:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.9);
            outline-offset: 3px;
        }

        .drill-social-icon {
            width: clamp(1.2rem, 2.4vw, 1.4rem);
            height: clamp(1.2rem, 2.4vw, 1.4rem);
            flex-shrink: 0;
        }

        body.drill-radial-theme > .main-footer {
            flex-shrink: 0;
            position: relative;
            isolation: isolate;
            border-top: none;
            padding: 0.4rem 0 max(0.45rem, env(safe-area-inset-bottom, 0px)) 0;
            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.08) 0%,
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    transparent 0%,
                    rgba(0, 0, 0, 0.18) 100%
                ),
                var(--drill-header-footer) !important;
        }

        body.drill-radial-theme > .main-footer,
        body.drill-radial-theme > .main-footer p,
        body.drill-radial-theme > .main-footer .developer-credit,
        body.drill-radial-theme > .main-footer a,
        body.drill-radial-theme > .main-footer .container,
        body.drill-radial-theme > .main-footer .footer-content {
            color: rgba(255, 248, 242, 0.96) !important;
            text-shadow: none !important;
        }

        body.drill-radial-theme > .main-footer .footer-copyright {
            opacity: 1;
        }

        body.drill-radial-theme > .main-footer .footer-copyright p,
        body.drill-radial-theme > .main-footer .developer-credit {
            margin: 0.08rem 0;
            line-height: 1.2;
        }

        body.drill-radial-theme > .main-footer .footer-copyright p {
            font-size: clamp(0.72rem, 2.4vw, 0.8rem);
        }

        body.drill-radial-theme > .main-footer .developer-credit {
            opacity: 0.85;
            font-size: clamp(0.65rem, 2.1vw, 0.72rem);
        }

        @media print {
            .drill-social-rail {
                display: none !important;
            }

            html,
            body.drill-radial-theme {
                overflow: visible !important;
                height: auto !important;
                min-height: 0 !important;
            }
        }
    </style>
</head>

        <script>
            (function () {
                var bar = document.querySelector(".drill-top-bar");
                var hero = document.getElementById("drill-hero-center");
                function syncDrillHeroPad() {
                    if (!bar || !hero) return;
                    var h = bar.getBoundingClientRect().height;
                    /* padding-top on .drill-hero-center clears fixed bar; keep in sync with bar height */
                    var px = Math.max(44, Math.round(h - 10)) + "px";
                    hero.style.setProperty("padding-top", px, "important");
                }
                var ro;
                function start() {
                    syncDrillHeroPad();
                    requestAnimationFrame(syncDrillHeroPad);
                    if (typeof ResizeObserver !== "undefined" && !ro) {
                        ro = new ResizeObserver(syncDrillHeroPad);
                        ro.observe(bar);
                    }
                }
                syncDrillHeroPad();
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", start);
                } else {
                    start();
                }
                window.addEventListener("resize", syncDrillHeroPad);
                window.addEventListener("load", syncDrillHeroPad);
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(function () {
                        requestAnimationFrame(syncDrillHeroPad);
                    });
                }
            })();

            /* Hide Tapered tile on first paint; show after scroll to section or #drill-section-tapered */
            (function () {
                var tapered = document.getElementById("drill-section-tapered");
                if (!tapered) return;
                function reveal() {
                    tapered.classList.remove("drill-tapered-pending");
                }
                function hashIsTapered() {
                    return (location.hash || "").replace(/^#/, "") === "drill-section-tapered";
                }
                function arm() {
                    if (hashIsTapered()) {
                        reveal();
                        return;
                    }
                    window.addEventListener("hashchange", function () {
                        if (hashIsTapered()) reveal();
                    });
                    if (typeof IntersectionObserver !== "undefined") {
                        var io = new IntersectionObserver(
                            function (entries) {
                                entries.forEach(function (e) {
                                    if (e.isIntersecting) {
                                        reveal();
                                        io.disconnect();
                                    }
                                });
                            },
                            { root: null, rootMargin: "100px 0px 0px 0px", threshold: 0.02 }
                        );
                        io.observe(tapered);
                    } else {
                        reveal();
                    }
                }
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", arm);
                } else {
                    arm();
                }
            })();
        </script>

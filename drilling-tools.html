<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robur Drilling Tools - Advanced Mining Equipment</title>
    <link rel="preload" as="image" href="images/drilling-theme-hero.jpeg" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="Bagerich/Bagerich-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="web-styles.css">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
    
    <style>
        /* Theme from drilling bit photo: industrial orange + dark rock */
        :root {
            --drill-orange: #ff6b35;
            --drill-rock: #1a1614;
            --drill-text: #f4f0ea;
            --drill-muted: rgba(244, 240, 234, 0.72);
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: var(--font-default);
            color: var(--drill-text);
            background-color: var(--drill-rock);
            background-image:
                linear-gradient(
                    165deg,
                    rgba(12, 10, 9, 0.88) 0%,
                    rgba(26, 22, 20, 0.45) 42%,
                    rgba(12, 10, 9, 0.9) 100%
                ),
                url("images/drilling-theme-hero.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                background-attachment: scroll;
            }
        }

        .coming-soon {
            margin: 0;
            text-align: center;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--drill-text);
            text-shadow:
                0 2px 24px rgba(0, 0, 0, 0.55),
                0 0 1px rgba(0, 0, 0, 0.8);
        }

        .coming-soon-wrap {
            text-align: center;
            display: grid;
            gap: 0.85rem;
            padding: 1.5rem clamp(1rem, 4vw, 2.5rem);
            max-width: min(92vw, 40rem);
        }

        .coming-soon-note {
            margin: 0;
            font-size: clamp(0.78rem, 1.7vw, 0.95rem);
            letter-spacing: 0.04em;
            color: var(--drill-muted);
            text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
        }

        .division-back {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.48rem 0.9rem;
            border-radius: 999px;
            background: rgba(12, 10, 9, 0.55);
            color: var(--drill-text);
            text-decoration: none !important;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255, 107, 53, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .division-back:hover,
        .division-back:focus-visible {
            background: rgba(255, 107, 53, 0.18);
            border-color: var(--drill-orange);
            outline: none;
        }

        .division-back:focus-visible {
            box-shadow: 0 0 0 2px rgba(244, 240, 234, 0.35);
        }
    </style>
</head>
<body>
    <a href="index.html" class="division-back" aria-label="Back to home">← Back</a>
    <main aria-label="Drilling Tools coming soon">
        <div class="coming-soon-wrap">
            <h1 class="coming-soon">COMING SOON</h1>
            <p class="coming-soon-note">&copy; 2026 Robur Mining Solutions. Developed by Fidinsky Tech Solutions.</p>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="is-drill-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robur Drilling Tools - Advanced Mining Equipment</title>
    <link rel="preload" as="image" href="images/drilling-theme-hero.jpeg?v=20" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="Bagerich/Bagerich-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="web-styles.css">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>

    <style>
        html.is-drill-page {
            height: 100%;
            min-height: 100%;
            margin: 0;
            background-color: #0a0a0a;
        }

        body.drill-page {
            margin: 0;
            min-height: 100%;
            min-height: 100dvh;
            font-family: var(--font-default);
            line-height: 1.6;
            overflow-x: hidden;
            background-color: #0a0a0a;
            background-image: none;
            isolation: isolate;
            position: relative;
        }

        .drill-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            box-sizing: border-box;
            min-height: 100vh;
            min-height: 100dvh;
            min-height: 100lvh;
            min-height: -webkit-fill-available;
            background-color: #0a0a0a;
            overflow: hidden;
        }

        .drill-bg img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            max-width: none;
            /* Intensity + extra bite for clarity (contrast-led so it stays clean) */
            filter: contrast(1.24) saturate(1.26) brightness(1.06);
            image-rendering: auto;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        @supports (image-rendering: high-quality) {
            .drill-bg img {
                image-rendering: high-quality;
            }
        }

        .drill-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            margin: 0;
            padding: 0.65rem 1rem;
            padding-bottom: max(0.65rem, env(safe-area-inset-bottom, 0px));
            text-align: center;
            font-size: clamp(0.78rem, 1.6vw, 0.9rem);
            font-weight: 500;
            letter-spacing: 0.04em;
            color: rgba(244, 240, 234, 0.92);
            background: rgba(8, 7, 6, 0.55);
            box-sizing: border-box;
        }

        .drill-footer p {
            margin: 0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
        }
    </style>
</head>
<body class="drill-page">
    <div class="drill-bg" aria-hidden="true">
        <img
            src="images/drilling-theme-hero.jpeg?v=20"
            alt=""
            loading="eager"
            decoding="sync"
            fetchpriority="high"
        >
    </div>
    <footer class="drill-footer">
        <p>Developed by Fidinsky Tech Solutions</p>
    </footer>
</body>
</html>

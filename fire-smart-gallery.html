<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Image Gallery - Robur Mining Solutions</title>
    <link rel="stylesheet" href="web-styles.css">
    <style>
        /* Override web-styles body { background: var(--bg) } (#000) — paint html + body red */
        html {
            min-height: 100%;
            background: linear-gradient(
                165deg,
                #d01f28 0%,
                #b01218 38%,
                #8f0e14 72%,
                #7a0c11 100%
            ) fixed;
        }
        .smart-gallery-back {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1200;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.46rem 0.88rem;
            border-radius: 999px;
            background: rgba(255, 248, 242, 0.12);
            color: rgba(255, 248, 242, 0.98) !important;
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255, 235, 224, 0.42);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .smart-gallery-back:hover {
            background: rgba(255, 248, 242, 0.2);
            color: #fff !important;
        }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(
                165deg,
                #d01f28 0%,
                #b01218 38%,
                #8f0e14 72%,
                #7a0c11 100%
            ) fixed !important;
            color: #fff;
            font-family: var(--font-default);
        }
        @media (max-width: 768px) {
            html {
                background: linear-gradient(
                    165deg,
                    #d01f28 0%,
                    #b01218 38%,
                    #8f0e14 72%,
                    #7a0c11 100%
                );
                background-attachment: scroll;
            }
            body {
                background: linear-gradient(
                    165deg,
                    #d01f28 0%,
                    #b01218 38%,
                    #8f0e14 72%,
                    #7a0c11 100%
                ) !important;
                background-attachment: scroll !important;
            }
        }
        .smart-page {
            width: 100%;
            box-sizing: border-box;
            padding: clamp(1.25rem, 3vw, 2rem);
            display: flex;
            flex-direction: column;
            gap: clamp(1rem, 2.25vw, 1.75rem);
            align-items: center;
            background: transparent;
        }
        .top-picked {
            margin: 0;
            width: min(22rem, 92vw);
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: transparent;
            border: none;
            box-shadow: none;
        }
        .top-picked img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: transparent;
        }
        .smart-grid {
            width: 100%;
            max-width: min(72rem, 100%);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(0.65rem, 1.75vw, 1.15rem);
        }
        .smart-empty {
            width: 100%;
            max-width: min(72rem, 100%);
            text-align: center;
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            padding: 0.9rem 1rem;
            border: none;
            border-radius: 10px;
            background: transparent;
            text-shadow: 0 1px 2px rgba(90, 0, 0, 0.35);
        }
        .smart-missing {
            width: 100%;
            max-width: min(72rem, 100%);
            margin: 0;
            text-align: center;
            color: rgba(255, 235, 224, 0.9);
            font-size: 0.85rem;
            line-height: 1.45;
            letter-spacing: 0.02em;
        }
        .smart-grid-item {
            margin: 0;
            aspect-ratio: 1 / 1;
            border-radius: clamp(4px, 1vw, 10px);
            overflow: hidden;
            background: transparent;
            border: none;
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.35),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }
        .smart-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            background: transparent;
        }
        #smartGrid {
            background: transparent;
        }
        .smart-extinguisher-details {
            width: 100%;
            max-width: min(72rem, 100%);
            margin: 0;
            padding: 0;
            border: none;
            border-radius: clamp(4px, 1vw, 10px);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.18);
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.35),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            box-sizing: border-box;
        }
        .smart-extinguisher-details img {
            width: 100%;
            height: auto;
            max-height: none;
            display: block;
            object-fit: contain;
            object-position: center top;
            background: transparent;
        }
        @media (max-width: 900px) {
            .smart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 560px) {
            .smart-grid { grid-template-columns: 1fr; }
        }
        .smart-page-footnote {
            width: 100%;
            max-width: min(72rem, 100%);
            text-align: center;
            padding: 1.25rem 1rem 1.75rem;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .smart-page-footnote p {
            margin: 0;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <a href="fire-solutions.html" class="smart-gallery-back" id="smartGalleryBack" aria-label="Back to Fire Solutions">← Back</a>
    <main class="smart-page">
        <figure class="top-picked">
            <img id="pickedTopImage" src="images/extinguishers/extinguisher-text.png" alt="Selected extinguisher image">
        </figure>

        <section id="smartGrid" class="smart-grid" aria-label="Smart image gallery"></section>

        <figure id="extinguisherDetailsBand" class="smart-extinguisher-details" hidden aria-label="Extinguisher product details">
            <img id="extinguisherDetailsImg" src="" alt="Extinguisher specifications and product details" decoding="async" loading="lazy">
        </figure>

    </main>

    <footer class="smart-page-footnote" aria-label="Copyright and developer credit">
        <p>&copy; 2026 Robur Mining Solutions. All rights reserved. Developed by Fidisnky Tech Solutions.</p>
    </footer>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var topImage = params.get('top');
            var topEl = document.getElementById('pickedTopImage');
            var grid = document.getElementById('smartGrid');
            var backEl = document.getElementById('smartGalleryBack');
            if (topImage && topEl) {
                topEl.src = topImage;
            }
            if (backEl) {
                var t = (topImage || "").toLowerCase();
                if (t.indexOf("extinguishers") !== -1) {
                    backEl.href = "fire-solutions.html#extinguishers";
                } else if (t.indexOf("smart-alarm") !== -1 || t.indexOf("smart_alarm") !== -1) {
                    backEl.href = "fire-solutions.html#smart-alarm-systems";
                } else {
                    backEl.href = "fire-solutions.html";
                }
            }

            var gridExtensions = ["webp", "jpeg", "jpg"];
            var sourceDirs = ["images/smart-alarm", "images/smart"];

            function pathKey(src) {
                try {
                    var p = new URL(src, window.location.href).pathname;
                    return p.replace(/\/+/g, "/").toLowerCase();
                } catch (err) {
                    return (src || "").replace(/\\/g, "/").toLowerCase();
                }
            }

            function tryLoadImage(url) {
                return new Promise(function (resolve) {
                    var img = new Image();
                    img.onload = function () { resolve(url); };
                    img.onerror = function () { resolve(null); };
                    img.src = url;
                });
            }

            async function resolveSmartImage(baseName) {
                var baseNames = [
                    baseName,
                    baseName.replace("smart", "smart-"),
                    baseName.replace("smart", "smart_"),
                    baseName.replace("smart", "smart "),
                    baseName.replace("smart", "smart(") + ")"
                ];
                for (var d = 0; d < sourceDirs.length; d += 1) {
                    for (var b = 0; b < baseNames.length; b += 1) {
                        for (var e = 0; e < gridExtensions.length; e += 1) {
                            var candidate = sourceDirs[d] + "/" + baseNames[b] + "." + gridExtensions[e];
                            var hit = await tryLoadImage(candidate);
                            if (hit) return hit;
                        }
                    }
                }
                return null;
            }

            /* Extinguisher photos originally supplied from Downloads (repo paths) */
            var extinguisherDownloadsRel = [
                "images/extinguishers/exting.jpeg",
                "images/extinguishers/exting1.jpeg",
                "images/extinguishers/exting2.jpeg",
                "images/extinguishers/exting3.jpeg",
                "images/extinguishers/exting4.jpeg"
            ];

            async function buildExtinguisherDownloadsGrid() {
                if (!grid) return;
                grid.setAttribute("aria-label", "Additional extinguisher images");
                var heroKey = topEl && topEl.src ? pathKey(topEl.src) : "";
                var added = 0;
                for (var i = 0; i < extinguisherDownloadsRel.length; i += 1) {
                    var rel = extinguisherDownloadsRel[i];
                    var pk = pathKey(rel);
                    if (heroKey && pk === heroKey) {
                        continue;
                    }
                    var hit = await tryLoadImage(rel);
                    if (!hit) {
                        continue;
                    }
                    var figure = document.createElement("figure");
                    figure.className = "smart-grid-item";
                    var img = document.createElement("img");
                    img.src = hit;
                    img.alt = "Extinguisher image " + (added + 1);
                    img.loading = "lazy";
                    figure.appendChild(img);
                    grid.appendChild(figure);
                    added += 1;
                }
                if (added === 0) {
                    var empty = document.createElement("p");
                    empty.className = "smart-empty";
                    empty.textContent = "No additional extinguisher images were found below the header.";
                    grid.replaceWith(empty);
                }
                var detailRel = "images/extinguishers/exting-details.jpeg";
                var band = document.getElementById("extinguisherDetailsBand");
                var bandImg = document.getElementById("extinguisherDetailsImg");
                if (band && bandImg) {
                    var detailHit = await tryLoadImage(detailRel);
                    if (detailHit) {
                        bandImg.src = detailHit;
                        band.removeAttribute("hidden");
                    }
                }
            }

            function buildCandidateNames() {
                var list = [];
                var seen = Object.create(null);

                function pushUnique(name) {
                    if (!name || seen[name]) return;
                    seen[name] = true;
                    list.push(name);
                }

                // Exact names requested by user
                pushUnique("smart");
                for (var i = 1; i <= 12; i += 1) {
                    pushUnique("smart" + i);
                    pushUnique("smart alarm" + i);
                }
                pushUnique("smart alarm");

                // Common variants to auto-include all available smart assets
                for (var j = 1; j <= 40; j += 1) {
                    pushUnique("smart" + j);
                    pushUnique("smart-" + j);
                    pushUnique("smart_" + j);
                    pushUnique("smart " + j);
                    pushUnique("smart-alarm-systems" + j);
                    pushUnique("smart_alarm_systems" + j);
                }
                pushUnique("smart-alarm-systems");
                pushUnique("smart_alarm_systems");

                return list;
            }

            async function buildSmartGrid() {
                var tl = (topImage || "").toLowerCase();
                /* extinguisher-text.png: header image only (no thumb grid or details strip) */
                if (tl.indexOf("extinguisher-text") !== -1) {
                    if (grid) grid.remove();
                    var bandTextOnly = document.getElementById("extinguisherDetailsBand");
                    if (bandTextOnly) bandTextOnly.remove();
                    return;
                }
                if (!grid) return;
                /* Extinguisher deep links: header + Downloads extinguisher set below */
                if (tl.indexOf("extinguishers") !== -1) {
                    await buildExtinguisherDownloadsGrid();
                    return;
                }
                var added = 0;
                var listPosition = 0;
                var seenPath = Object.create(null);
                var candidates = buildCandidateNames();
                var heroKey = topEl && topEl.src ? pathKey(topEl.src) : "";
                var heroIsExtinguisher =
                    (topImage && topImage.toLowerCase().indexOf("extinguisher") !== -1) ||
                    (heroKey && heroKey.indexOf("extinguisher") !== -1);
                var useCustomRemovals =
                    (topImage && topImage.toLowerCase().indexOf("smart-alarm-systems.jpeg") !== -1) ||
                    (heroKey && heroKey.indexOf("/images/smart-alarm/smart-alarm-systems.jpeg") !== -1);
                var removedPositions = {
                    1: true,
                    2: true,
                    4: true,
                    6: true,
                    8: true,
                    10: true,
                    13: true,
                    14: true,
                    15: true,
                    16: true
                };

                for (var i = 0; i < candidates.length; i += 1) {
                    var cand = candidates[i];
                    if (heroIsExtinguisher && cand === "smart") {
                        continue;
                    }
                    var src = await resolveSmartImage(cand);
                    if (!src) {
                        continue;
                    }
                    var pk = pathKey(src);
                    if (heroKey && pk === heroKey) continue;
                    if (seenPath[pk]) continue;
                    seenPath[pk] = true;
                    listPosition += 1;
                    if (useCustomRemovals && removedPositions[listPosition]) continue;

                    var figure = document.createElement("figure");
                    figure.className = "smart-grid-item";

                    var img = document.createElement("img");
                    img.src = src;
                    img.alt = "Smart image " + (i + 1);
                    img.loading = "lazy";

                    figure.appendChild(img);
                    grid.appendChild(figure);
                    added += 1;
                }

                if (added === 0) {
                    var empty = document.createElement("p");
                    empty.className = "smart-empty";
                    empty.textContent = "No .webp smart images were found in images/smart-alarm or images/smart.";
                    grid.replaceWith(empty);
                }
            }

            buildSmartGrid().catch(function () {});
        })();
    </script>
</body>
</html>

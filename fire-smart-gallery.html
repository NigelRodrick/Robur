<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Image Gallery - Robur Mining Solutions</title>
    <link rel="stylesheet" href="web-styles.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #1a0a05;
            background-image: url('images/fire-theme.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            font-family: var(--font-default);
        }
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
        }
        .smart-page {
            width: 100%;
            box-sizing: border-box;
            padding: clamp(1.25rem, 3vw, 2rem);
            display: flex;
            flex-direction: column;
            gap: clamp(1rem, 2.25vw, 1.75rem);
            align-items: center;
        }
        .top-picked {
            margin: 0;
            width: min(22rem, 92vw);
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.12),
                0 18px 38px rgba(0, 0, 0, 0.28);
        }
        .top-picked img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .smart-grid {
            width: 100%;
            max-width: min(72rem, 100%);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(0.65rem, 1.75vw, 1.15rem);
        }
        .smart-empty {
            width: 100%;
            max-width: min(72rem, 100%);
            text-align: center;
            color: rgba(255, 255, 255, 0.88);
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            padding: 0.9rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: transparent;
            text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
        }
        .smart-missing {
            width: 100%;
            max-width: min(72rem, 100%);
            margin: 0;
            text-align: center;
            color: rgba(255, 235, 224, 0.9);
            font-size: 0.85rem;
            line-height: 1.45;
            letter-spacing: 0.02em;
        }
        .smart-grid-item {
            margin: 0;
            aspect-ratio: 1 / 1;
            border-radius: clamp(4px, 1vw, 10px);
            overflow: hidden;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 3px 5px rgba(0, 0, 0, 0.1),
                0 14px 32px rgba(0, 0, 0, 0.26);
        }
        .smart-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        @media (max-width: 900px) {
            .smart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 560px) {
            .smart-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="smart-page">
        <figure class="top-picked">
            <img id="pickedTopImage" src="images/extinguishers/extinguisher-text.png" alt="Selected extinguisher image">
        </figure>

        <section id="smartGrid" class="smart-grid" aria-label="Smart image gallery"></section>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var topImage = params.get('top');
            var topEl = document.getElementById('pickedTopImage');
            var grid = document.getElementById('smartGrid');
            if (topImage && topEl) {
                topEl.src = topImage;
            }

            var gridExtensions = ["webp"];
            var sourceDirs = ["images/smart-alarm", "images/smart"];

            function tryLoadImage(url) {
                return new Promise(function (resolve) {
                    var img = new Image();
                    img.onload = function () { resolve(url); };
                    img.onerror = function () { resolve(null); };
                    img.src = url;
                });
            }

            async function resolveSmartImage(baseName) {
                var baseNames = [
                    baseName,
                    baseName.replace("smart", "smart-"),
                    baseName.replace("smart", "smart_"),
                    baseName.replace("smart", "smart "),
                    baseName.replace("smart", "smart(") + ")"
                ];
                for (var d = 0; d < sourceDirs.length; d += 1) {
                    for (var b = 0; b < baseNames.length; b += 1) {
                        for (var e = 0; e < gridExtensions.length; e += 1) {
                            var candidate = sourceDirs[d] + "/" + baseNames[b] + "." + gridExtensions[e];
                            var hit = await tryLoadImage(candidate);
                            if (hit) return hit;
                        }
                    }
                }
                return null;
            }

            function buildCandidateNames() {
                var list = [];
                var seen = Object.create(null);

                function pushUnique(name) {
                    if (!name || seen[name]) return;
                    seen[name] = true;
                    list.push(name);
                }

                // Exact names requested by user
                pushUnique("smart");
                for (var i = 1; i <= 7; i += 1) pushUnique("smart" + i);

                // Common variants to auto-include all available smart assets
                for (var j = 1; j <= 40; j += 1) {
                    pushUnique("smart" + j);
                    pushUnique("smart-" + j);
                    pushUnique("smart_" + j);
                    pushUnique("smart " + j);
                    pushUnique("smart-alarm-systems" + j);
                    pushUnique("smart_alarm_systems" + j);
                }
                pushUnique("smart-alarm-systems");
                pushUnique("smart_alarm_systems");

                return list;
            }

            async function buildSmartGrid() {
                if (!grid) return;
                var added = 0;
                var seenSrc = Object.create(null);
                var candidates = buildCandidateNames();

                for (var i = 0; i < candidates.length; i += 1) {
                    var src = await resolveSmartImage(candidates[i]);
                    if (!src) {
                        continue;
                    }
                    if (seenSrc[src]) continue;
                    seenSrc[src] = true;

                    var figure = document.createElement("figure");
                    figure.className = "smart-grid-item";

                    var img = document.createElement("img");
                    img.src = src;
                    img.alt = "Smart image " + (i + 1);
                    img.loading = "lazy";

                    figure.appendChild(img);
                    grid.appendChild(figure);
                    added += 1;
                }

                if (added === 0) {
                    var empty = document.createElement("p");
                    empty.className = "smart-empty";
                    empty.textContent = "No .webp smart images were found in images/smart-alarm or images/smart.";
                    grid.replaceWith(empty);
                }
            }

            buildSmartGrid();
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Image Gallery - Robur Mining Solutions</title>
    <link rel="stylesheet" href="web-styles.css">
    <style>
        /* Override web-styles body { background: var(--bg) } (#000) — paint html + body red */
        html {
            min-height: 100%;
            background: linear-gradient(
                165deg,
                #d01f28 0%,
                #b01218 38%,
                #8f0e14 72%,
                #7a0c11 100%
            ) fixed;
        }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(
                165deg,
                #d01f28 0%,
                #b01218 38%,
                #8f0e14 72%,
                #7a0c11 100%
            ) fixed !important;
            color: #fff;
            font-family: var(--font-default);
        }
        @media (max-width: 768px) {
            html {
                background: linear-gradient(
                    165deg,
                    #d01f28 0%,
                    #b01218 38%,
                    #8f0e14 72%,
                    #7a0c11 100%
                );
                background-attachment: scroll;
            }
            body {
                background: linear-gradient(
                    165deg,
                    #d01f28 0%,
                    #b01218 38%,
                    #8f0e14 72%,
                    #7a0c11 100%
                ) !important;
                background-attachment: scroll !important;
            }
        }
        .smart-page {
            width: 100%;
            box-sizing: border-box;
            padding: clamp(1.25rem, 3vw, 2rem);
            display: flex;
            flex-direction: column;
            gap: clamp(1rem, 2.25vw, 1.75rem);
            align-items: center;
            background: transparent;
        }
        .top-picked {
            margin: 0;
            width: min(22rem, 92vw);
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: transparent;
            border: none;
            box-shadow: none;
        }
        .top-picked img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: transparent;
        }
        .smart-grid {
            width: 100%;
            max-width: min(72rem, 100%);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(0.65rem, 1.75vw, 1.15rem);
        }
        .smart-empty {
            width: 100%;
            max-width: min(72rem, 100%);
            text-align: center;
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            padding: 0.9rem 1rem;
            border: none;
            border-radius: 10px;
            background: transparent;
            text-shadow: 0 1px 2px rgba(90, 0, 0, 0.35);
        }
        .smart-missing {
            width: 100%;
            max-width: min(72rem, 100%);
            margin: 0;
            text-align: center;
            color: rgba(255, 235, 224, 0.9);
            font-size: 0.85rem;
            line-height: 1.45;
            letter-spacing: 0.02em;
        }
        .smart-grid-item {
            margin: 0;
            aspect-ratio: 1 / 1;
            border-radius: clamp(4px, 1vw, 10px);
            overflow: hidden;
            background: transparent;
            border: none;
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.35),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }
        .smart-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            background: transparent;
        }
        #smartGrid {
            background: transparent;
        }
        @media (max-width: 900px) {
            .smart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 560px) {
            .smart-grid { grid-template-columns: 1fr; }
        }
        .smart-page-footnote {
            width: 100%;
            max-width: min(72rem, 100%);
            text-align: center;
            padding: 1.25rem 1rem 1.75rem;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .smart-page-footnote p {
            margin: 0;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="smart-page">
        <figure class="top-picked">
            <img id="pickedTopImage" src="images/extinguishers/extinguisher-text.png" alt="Selected extinguisher image">
        </figure>

        <section id="smartGrid" class="smart-grid" aria-label="Smart image gallery"></section>

    </main>

    <footer class="smart-page-footnote" aria-label="Copyright and developer credit">
        <p>&copy; 2026 Robur Mining Solutions. All rights reserved. Developed by Fidisnky Tech Solutions.</p>
    </footer>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var topImage = params.get('top');
            var galleryMode = (params.get('gallery') || '').toLowerCase();
            var isExtinguisherGallery = galleryMode === 'extinguishers';
            var topEl = document.getElementById('pickedTopImage');
            var grid = document.getElementById('smartGrid');
            if (topImage && topEl) {
                topEl.src = topImage;
                topEl.alt = isExtinguisherGallery ? 'Selected extinguisher image' : 'Selected gallery image';
            }

            var gridExtensionsSmart = ["webp", "jpeg", "jpg"];
            var gridExtensionsExtinguisher = ["png", "webp", "jpeg", "jpg"];
            var smartSourceDirs = ["images/smart-alarm", "images/smart"];
            var extinguisherSourceDirs = ["images/extinguishers"];

            function pathKey(src) {
                try {
                    var p = new URL(src, window.location.href).pathname;
                    return p.replace(/\/+/g, "/").toLowerCase();
                } catch (err) {
                    return (src || "").replace(/\\/g, "/").toLowerCase();
                }
            }

            function tryLoadImage(url) {
                return new Promise(function (resolve) {
                    var img = new Image();
                    img.onload = function () { resolve(url); };
                    img.onerror = function () { resolve(null); };
                    img.src = url;
                });
            }

            async function resolveSmartImage(baseName) {
                var baseNames = [
                    baseName,
                    baseName.replace("smart", "smart-"),
                    baseName.replace("smart", "smart_"),
                    baseName.replace("smart", "smart "),
                    baseName.replace("smart", "smart(") + ")"
                ];
                for (var d = 0; d < smartSourceDirs.length; d += 1) {
                    for (var b = 0; b < baseNames.length; b += 1) {
                        for (var e = 0; e < gridExtensionsSmart.length; e += 1) {
                            var candidate = smartSourceDirs[d] + "/" + baseNames[b] + "." + gridExtensionsSmart[e];
                            var hit = await tryLoadImage(candidate);
                            if (hit) return hit;
                        }
                    }
                }
                return null;
            }

            function buildCandidateNames() {
                var list = [];
                var seen = Object.create(null);

                function pushUnique(name) {
                    if (!name || seen[name]) return;
                    seen[name] = true;
                    list.push(name);
                }

                // Exact names requested by user
                pushUnique("smart");
                for (var i = 1; i <= 12; i += 1) {
                    pushUnique("smart" + i);
                    pushUnique("smart alarm" + i);
                }
                pushUnique("smart alarm");

                // Common variants to auto-include all available smart assets
                for (var j = 1; j <= 40; j += 1) {
                    pushUnique("smart" + j);
                    pushUnique("smart-" + j);
                    pushUnique("smart_" + j);
                    pushUnique("smart " + j);
                    pushUnique("smart-alarm-systems" + j);
                    pushUnique("smart_alarm_systems" + j);
                }
                pushUnique("smart-alarm-systems");
                pushUnique("smart_alarm_systems");

                return list;
            }

            function buildExtinguisherCandidateNames() {
                var list = [];
                var seen = Object.create(null);
                function pushUnique(name) {
                    if (!name || seen[name]) return;
                    seen[name] = true;
                    list.push(name);
                }
                pushUnique("extinguisher-text");
                pushUnique("extinguisher-red");
                pushUnique("extinguisher");
                for (var i = 1; i <= 12; i += 1) {
                    pushUnique("extinguisher" + i);
                }
                return list;
            }

            async function resolveExtinguisherImage(baseName) {
                for (var d = 0; d < extinguisherSourceDirs.length; d += 1) {
                    for (var e = 0; e < gridExtensionsExtinguisher.length; e += 1) {
                        var candidate = extinguisherSourceDirs[d] + "/" + baseName + "." + gridExtensionsExtinguisher[e];
                        var hit = await tryLoadImage(candidate);
                        if (hit) return hit;
                    }
                }
                return null;
            }

            async function resolveGridImage(baseName) {
                if (isExtinguisherGallery) {
                    return resolveExtinguisherImage(baseName);
                }
                return resolveSmartImage(baseName);
            }

            async function buildSmartGrid() {
                if (!grid) return;
                var added = 0;
                var listPosition = 0;
                var seenPath = Object.create(null);
                var candidates = isExtinguisherGallery ? buildExtinguisherCandidateNames() : buildCandidateNames();
                var heroKey = topEl && topEl.src ? pathKey(topEl.src) : "";
                var heroIsExtinguisher =
                    (topImage && topImage.toLowerCase().indexOf("extinguisher") !== -1) ||
                    (heroKey && heroKey.indexOf("extinguisher") !== -1);
                var useCustomRemovals =
                    !isExtinguisherGallery &&
                    ((topImage && topImage.toLowerCase().indexOf("smart-alarm-systems.jpeg") !== -1) ||
                    (heroKey && heroKey.indexOf("/images/smart-alarm/smart-alarm-systems.jpeg") !== -1));
                var removedPositions = {
                    1: true,
                    2: true,
                    4: true,
                    6: true,
                    8: true,
                    10: true,
                    13: true,
                    14: true,
                    15: true,
                    16: true
                };

                for (var i = 0; i < candidates.length; i += 1) {
                    var cand = candidates[i];
                    if (!isExtinguisherGallery && heroIsExtinguisher && cand === "smart") {
                        continue;
                    }
                    var src = await resolveGridImage(cand);
                    if (!src) {
                        continue;
                    }
                    var pk = pathKey(src);
                    if (heroKey && pk === heroKey) continue;
                    if (seenPath[pk]) continue;
                    seenPath[pk] = true;
                    listPosition += 1;
                    if (useCustomRemovals && removedPositions[listPosition]) continue;

                    var figure = document.createElement("figure");
                    figure.className = "smart-grid-item";

                    var img = document.createElement("img");
                    img.src = src;
                    img.alt = isExtinguisherGallery ? ("Extinguisher image " + (added + 1)) : ("Smart image " + (i + 1));
                    img.loading = "lazy";

                    figure.appendChild(img);
                    grid.appendChild(figure);
                    added += 1;
                }

                if (added === 0) {
                    var empty = document.createElement("p");
                    empty.className = "smart-empty";
                    empty.textContent = isExtinguisherGallery
                        ? "No extinguisher images were found in images/extinguishers."
                        : "No .webp smart images were found in images/smart-alarm or images/smart.";
                    grid.replaceWith(empty);
                }
            }

            buildSmartGrid();
        })();
    </script>
</body>
</html>
